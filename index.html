<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega III - Aplicação Interativa SPA</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <a class="skip-link" href="#app-content">Pular para o conteúdo principal</a>
    <header>
        <h1>Minha Aplicação Interativa (SPA)</h1>
        <nav aria-label="Navegação principal">
            <a href="#home">Home</a> |
            <a href="#produtos">Produtos</a> |
            <a href="#contato">Contato (Formulário)</a>
        </nav>
        <div class="accessibility-controls" role="group" aria-label="Opções de acessibilidade">
            <span>Acessibilidade:</span>
            <button id="decrease-font" type="button" aria-label="Diminuir tamanho do texto">A−</button>
            <button id="increase-font" type="button" aria-label="Aumentar tamanho do texto">A+</button>
            <button id="toggle-contrast" type="button" aria-pressed="false">Alto contraste</button>
        </div>
    </header>

    <main id="app-content" tabindex="-1" aria-live="polite">
        </main>

    <p id="accessibility-status" class="sr-only" role="status" aria-live="polite"></p>

    <footer>
        <p>&copy; 2025 - Entrega III de JavaScript Avançado</p>
    </footer>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
